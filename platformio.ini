[platformio]
default_envs = cyd

; Tip: if PlanarNexus uses a specific "platform = ..." line (Arduino core 3.x),
; copy that same line here so both projects build the same way.

; ============================================================================
; CYD 2.8" - Software SPI Touch (original)
; ============================================================================
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTOUCH_CS=33
    -DTOUCH_CLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DSMOOTH_FONT

; Touch calibration helper for 2.8"
[env:cyd_touchtest]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DTOUCH_TEST

; ============================================================================
; CYD 3.2 - Freenove FNK0114 with TFT_eSPI integrated touch
; ============================================================================
[env:cyd32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_TOUCH_FNK0114
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=LOW
    -DTOUCH_CS=33
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=6000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_DMA_TO_FRAME_BUFFER=1

; Touch calibration helper for 3.2"
[env:cyd32_touchtest]
extends = env:cyd32
build_flags =
    ${env:cyd32.build_flags}
    -DTOUCH_TEST
