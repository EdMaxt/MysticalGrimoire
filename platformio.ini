[platformio]
default_envs = cyd

; Tip: if PlanarNexus uses a specific "platform = ..." line (Arduino core 3.x),
; copy that same line here so both projects build the same way.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTOUCH_CS=33
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DSMOOTH_FONT
    ; If colors are inverted add:  -DINVERT_DISPLAY
    ; If red and blue are swapped: -DTFT_RGB_ORDER=TFT_BGR

; Touch calibration helper: draws a dot where you press and prints raw values.
[env:cyd_touchtest]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DTOUCH_TEST
